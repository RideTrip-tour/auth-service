name: PR Checks

on:
  pull_request:
    branches:
      - release
      - develop
      - main

jobs:
  ruff:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-ruff.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
  
  mypy:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-mypy.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      mypy-target: app

  tests:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-test.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      coverage-source: app
      coverage-min: 90
  
  notify:
    needs: [ruff, tests, mypy]
    if: contains(needs.*.result, 'failure')
    uses: RideTrip-tour/ci-templates/.github/workflows/telegram-notify.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      service-name: ${{ vars.SERVICE_NAME || 'auth-service' }}
      environment: DEV
      swarm-service: ${{ vars.AUTH_SWARM_SERVICE || 'apps_auth-service' }}
      results-json: ${{ toJSON(needs) }}
    secrets: inherit