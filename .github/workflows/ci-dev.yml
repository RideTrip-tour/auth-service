name: CI Dev

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ruff:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-ruff.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
  
  mypy:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-mypy.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      mypy-target: app

  tests:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-test.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      coverage-source: app
      coverage-min: 90

  alembic_python_check:
    needs: [ruff, mypy, tests]
    uses: RideTrip-tour/ci-templates/.github/workflows/python-alembic-check.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
  

  build:
    needs: [ruff, tests, mypy, alembic_python_check]
    if: github.event_name == 'push'
    uses: RideTrip-tour/ci-templates/.github/workflows/docker-build-push.yml@68e5d7c76800634e7ce9da738a7c3cf919735926
    with:
      namespace: ${{ vars.DOCKERHUB_NAMESPACE || 'ride2trip' }}
      service-name: ${{ vars.SERVICE_AUTH_NAME || 'auth-service' }}
      tag-prefix: dev
    secrets: inherit

  debug_build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Debug reusable workflow output
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail
          echo "Workflow output: $IMAGE_REF"
          test -n "$IMAGE_REF"

  alembic_check:
    needs: build
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-alembic-check.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      service-name: ${{ vars.SERVICE_AUTH_NAME || 'auth-service' }}
      image-ref: ${{ needs.build.outputs.image-ref }}
      data-network: ${{ vars.DATA_NETWORK || 'data-network' }}
      db-secret-prefix: ${{ vars.DB_AUTH_SECRET_PREFIX || 'DB_AUTH_SERVICE'}}
      environment: DEV
    secrets: inherit

  migrate:
    needs: [build, alembic_check]
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-migrate.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      service-name: ${{ vars.SERVICE_AUTH_NAME || 'auth-service' }}
      image-ref: ${{ needs.build.outputs.image-ref }}
      data-network: ${{ vars.DATA_NETWORK || 'data-network' }}
      db-secret-prefix: ${{ vars.DB_AUTH_SECRET_PREFIX || 'DB_AUTH_SERVICE'}}
      environment: DEV
    secrets: inherit

  deploy:
    needs: [build, migrate]
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-deploy.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      image-ref: ${{ needs.build.outputs.image-ref }}
      swarm-service: ${{ vars.AUTH_SWARM_SERVICE || 'apps_auth-service' }}
      environment: DEV
    secrets: inherit

  healthcheck:
    needs: deploy
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-healthcheck.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      service-name: ${{ vars.SERVICE_AUTH_NAME || 'auth-service' }}
      app-name: ${{ vars.APP_NAME || 'auth' }}
      data-network: ${{ vars.DATA_NETWORK || 'data-network' }}
      environment: DEV
    secrets: inherit

  # notify:
  #   needs: [ruff, tests, mypy, build, alembic_check, migrate, deploy, healthcheck]
  #   if: ${{ always() && (github.event_name == 'push' || contains(needs.*.result, 'failure')) }}
  #   uses: RideTrip-tour/ci-templates/.github/workflows/telegram-notify.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
  #   with:
  #     service-name: ${{ vars.SERVICE_AUTH_NAME || 'auth-service' }}
  #     environment: DEV
  #     swarm-service: ${{ vars.AUTH_SWARM_SERVICE || 'apps_auth-service' }}
  #     results-json: ${{ toJSON(needs) }}
  #     image-ref: ${{ needs.build.outputs.image-ref }}
  #   secrets: inherit