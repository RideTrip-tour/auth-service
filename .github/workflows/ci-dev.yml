name: CI Dev

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'ride2trip' }}
  SWARM_SERVICE: ${{ vars.AUTH_SWARM_SERVICE || 'apps_auth-service' }}
  DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'auth-service' }}
  APP_NAME: ${{ vars.APP_NAME || 'auth' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'DEV' }}
  DB_SECRET_PREFIX: ${{ var.DB_SECRET_PREFIX || 'DB_AUTH_SERVICE'}}

jobs:
  ruff:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-ruff.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
  
  mypy:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-mypy.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      mypy-target: app

  tests:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-test.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      coverage-source: app
      coverage-min: 90

  build:
    needs: [ruff, tests]
    if: github.event_name == 'push'
    uses: RideTrip-tour/ci-templates/.github/workflows/docker-build-push.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      namespace: ${{ env.DOCKERHUB_NAMESPACE }}
      service-name: ${{ env.SERVICE_NAME }}
      tag-prefix: dev
    secrets: inherit

  alembic_check:
    needs: build
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-alembic-check.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      service-name: ${{ env.SERVICE_NAME }}
      image-ref: ${{ needs.build.outputs.image-ref }}
      data-network: ${{ env.DATA_NETWORK }}
      db-secret-prefix: ${{ env.DB_SECRET_PREFIX }}
      environment: DEV
    secrets: inherit

  migrate:
    needs: [build, alembic_check]
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-migrate.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      service-name: ${{ env.SERVICE_NAME || 'auth-service' }}
      image-ref: ${{ needs.build.outputs.image-ref }}
      data-network: ${{ env.DATA_NETWORK || 'data-network' }}
      db-secret-prefix: ${{ env.DB_SECRET_PREFIX }}
      environment: DEV
    secrets: inherit

  deploy:
    needs: [build, migrate]
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-deploy.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      image-ref: ${{ needs.build.outputs.image-ref }}
      swarm-service: ${{ env.SWARM_SERVICE }}
      environment: DEV
    secrets: inherit

  healthcheck:
    needs: deploy
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-healthcheck.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      service-name: ${{ env.SERVICE_NAME }}
      app-name: ${{ env.APP_NAME }}
      data-network: ${{ env.DATA_NETWORK}}
      environment: DEV
    secrets: inherit

  notify:
    needs: [ruff, tests, build, alembic_check, migrate, deploy, healthcheck]
    if: ${{ always() && (github.event_name == 'push' || contains(needs.*.result, 'failure')) }}
    uses: RideTrip-tour/ci-templates/.github/workflows/telegram-notify.yml@c5384ac2be0894e41b76dcf103d9f5ef79b32f44
    with:
      service-name: ${{ env.SERVICE_NAME }}
      environment: DEV
      swarm-service: ${{ env.SWARM_SERVICE }}
      results-json: ${{ toJSON(needs) }}
      image-ref: ${{ needs.build.outputs.image-ref }}
    secrets: inherit